name: CI

# Nenhum segredo é usado aqui de propósito: o pipeline usa só um Postgres
# descartável criado no próprio job (sem Redis e sem API de IA). Typecheck,
# lint, testes unitários e o teste de integração (isolamento entre empresas,
# cotas e auditoria) rodam offline.
on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o pipeline só precisa ler o repositório. Sem isto o token
# do job herda as permissões padrão do repositório, que podem incluir escrita.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      JWT_SECRET: ci-apenas-para-compilar
      AI_ANALYSIS_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências da API
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Conferir tipos da API
        run: npm run typecheck

      - name: Lint da API
        run: npm run lint

      - name: Testes unitários
        run: npm run test

      # Aplica TODAS as migrations num banco vazio (prova que o histórico
      # reconstrói o schema do zero) e roda a API de verdade contra ele.
      - name: Aplicar migrations em banco vazio
        run: npx prisma migrate deploy

      - name: Testes de integração (banco real)
        run: npm run test:integracao
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      # Falha o CI se surgir vulnerabilidade alta/crítica nas dependências de
      # produção — pega regressão de dependência antes de ir pro deploy.
      - name: Auditoria de dependências (produção)
        run: npm audit --omit=dev --audit-level=high

      - name: Instalar dependências do frontend
        run: npm ci
        working-directory: web

      # next build, e não tsc: os tipos de rota do Next 16 (LayoutProps e afins)
      # só existem depois que o build os gera.
      - name: Build do frontend
        run: npx next build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3333
