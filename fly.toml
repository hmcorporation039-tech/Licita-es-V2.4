# fly.toml app configuration file generated for licita-es-v2-4 on 2026-11-09T01:47:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'licita-es-v2-4'
primary_region = 'gru'

[build]
  dockerfile = 'navegador.Dockerfile'

[env]
  NAVEGADOR_MAX_SESSOES = '3'
  NAVEGADOR_ORIGENS = 'https://licitabela.com.br,https://www.licitabela.com.br,https://licita-es-v2-4.vercel.app'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 40
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/saude'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
